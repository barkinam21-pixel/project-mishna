name: Mishnah Studio - Safe Preflight
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate truthful stage-gate and Codex session handoff (no spend)
        run: python tools/session_handoff.py --out-json build/session-handoff.json --out-md build/session-handoff.md
      - name: Upload durable session-handoff status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-session-handoff
          path: |
            build/session-handoff.json
            build/session-handoff.md
          if-no-files-found: error
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Zero-cost episode plan
        run: python tools/studio.py episodes/berakhot-01-01/manifest.json --output build/preflight.json
      - name: Validate editorial proof storyboard (no media creation)
        run: python tools/validate_proof_blueprint.py episodes/berakhot-01-01/proof-blueprint.json --output build/editorial-plan-review.json
      - name: Upload editorial plan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-plan-review
          path: build/editorial-plan-review.json
      - name: Upload preflight report
        uses: actions/upload-artifact@v4
        with:
          name: preflight-report
          path: build/preflight.json
  source_comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compare three Sefaria editions (no publication, no approval)
        run: python tools/compare_sefaria_editions.py
      - name: Upload source evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sefaria-three-edition-audit
          path: build/sefaria-variant-comparison.json

  voice_sync_diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit narration pacing in 12-sequence longform draft (no voice claimed)
        run: python tools/pacing_audit.py scripts/episode-01-before-dawn.md --output build/episode-01-pacing-audit.json
      - name: Validate WAV voice-take slots (explicitly blocked while recordings missing)
        run: python tools/voice_take_audit.py episodes/berakhot-01-01/voice-rehearsal-draft.json --output build/voice-take-audit.json
      - name: Install FFmpeg and Hebrew-capable fallback fonts on fresh runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -hide_banner -filters | grep subtitles
      - name: Render Hebrew captions with sample-accurate synthetic sync markers
        run: python tools/sync_probe.py --out-dir build/sync-probe
      - name: Upload review reports and 12-second TECHNICAL test ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-pacing-and-av-sync-technical-test
          path: |
            build/episode-01-pacing-audit.json
            build/voice-take-audit.json
            build/sync-probe/sync-qa.json
            build/sync-probe/sync-test.mp4
            build/sync-probe/sync-test.srt
          if-no-files-found: warn
