name: Scene factory M3 OFFLINE batch admission
on:
  pull_request:
    paths:
      - 'tools/scene_m3.py'
      - 'tests/test_scene_m3.py'
      - '.github/workflows/scene-factory-m3.yml'
      - 'tools/scene_factory.py'
      - 'episodes/berakhot-01-01/scene-*.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scene-factory-m3-${{ github.ref }}
  cancel-in-progress: false
  queue: max
jobs:
  mock-only-m3:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: M1 regression and M3 reservation/replay safety
        run: python -m unittest tests.test_scene_factory tests.test_scene_m3 -v
      - name: Current artistic prologue MUST block (zero inference)
        run: |
          python - <<'PY'
          import json, subprocess
          p=subprocess.run(['python','-m','tools.scene_m3','simulate','--request-id','m3-safe-ci'],
                           capture_output=True,text=True)
          data=json.loads(p.stdout)
          assert p.returncode==2 and data['status']=='BLOCKED',data
          assert data['external_inference_requests']==0 and not data['live_generation_enabled']
          assert 'ASSET_CONTINUITY_TIME_OF_DAY:EP-P07' in data['issues']
          print('M3 current prologue safely blocked without any provider operation')
          PY
