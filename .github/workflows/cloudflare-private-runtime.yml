name: Private Cloudflare studio (owner dispatch only)
on:
  pull_request:
    paths: ['tools/private_drive_runtime.py', 'tools/comfy_scene_images.py', 'tests/test_private_drive_runtime.py', 'tests/test_private_runtime_preparation.py', 'tools/authorize_private_drive.py', 'tests/test_authorize_private_drive.py', '.github/workflows/cloudflare-private-runtime.yml']
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [check, run]
        default: check
permissions:
  contents: read
concurrency:
  group: mishnah-private-image-runtime
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: python -m unittest tests.test_private_drive_runtime tests.test_private_runtime_preparation tests.test_authorize_private_drive -v
  cloudflare-readonly:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.operation == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Read Workers AI catalogue and recorded usage only
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m tools.private_drive_runtime check-cloudflare
  drive-readonly:
    needs: cloudflare-readonly
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && inputs.operation == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Owner-only Drive access check (no creation or modification)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MISHNAH_DRIVE_OAUTH_JSON: ${{ secrets.MISHNAH_DRIVE_OAUTH_JSON }}
          MISHNAH_REFERENCE_FILE_ID: ${{ secrets.MISHNAH_REFERENCE_FILE_ID }}
          MISHNAH_STATE_FILE_ID: ${{ secrets.MISHNAH_STATE_FILE_ID }}
          MISHNAH_SNAPSHOT_FILE_ID: ${{ secrets.MISHNAH_SNAPSHOT_FILE_ID }}
        run: python -m tools.private_drive_runtime check-drive
  private-runtime:
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner && github.sha == vars.MISHNAH_IMAGE_REVIEWED_SHA && inputs.operation == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - name: Existing private storage and studio runtime (no artifact upload)
        env:
          OPERATION: ${{ inputs.operation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MISHNAH_DRIVE_OAUTH_JSON: ${{ secrets.MISHNAH_DRIVE_OAUTH_JSON }}
          MISHNAH_REFERENCE_FILE_ID: ${{ secrets.MISHNAH_REFERENCE_FILE_ID }}
          MISHNAH_STATE_FILE_ID: ${{ secrets.MISHNAH_STATE_FILE_ID }}
          MISHNAH_SNAPSHOT_FILE_ID: ${{ secrets.MISHNAH_SNAPSHOT_FILE_ID }}
        run: python -m tools.private_drive_runtime "$OPERATION"
      - name: Remove private runner data
        if: always()
        run: rm -rf private-media
