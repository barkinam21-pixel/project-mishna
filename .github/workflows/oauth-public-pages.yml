name: Publish OAuth information pages
on:
  push:
    branches: ["main"]
    paths:
      - "oauth-public/**"
      - ".github/workflows/oauth-public-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: oauth-public-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload ONLY public OAuth information pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: oauth-public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
