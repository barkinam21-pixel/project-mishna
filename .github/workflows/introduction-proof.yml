name: Introduction proof offline assembly
on:
  workflow_dispatch:
  push:
    paths: ['tools/introduction_*.py', 'tests/test_introduction_*.py', 'episodes/berakhot-01-01/introduction-proof.json', '.github/workflows/introduction-proof.yml']
permissions:
  contents: read
jobs:
  assembly-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - run: python -m tools.introduction_proof
      - run: python -m unittest discover -s tests -p 'test_introduction_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: TECHNICAL-TEST-NOT-APPROVED-introduction
          path: |
            build/introduction-proof-state.json
            build/introduction-fixture/output/private-captions.*
            build/introduction-fixture/integration-result.json
