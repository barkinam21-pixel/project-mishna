name: Introduction proof offline assembly
on:
  workflow_dispatch:
  push:
    paths: ['tools/studio.py', 'tools/studio_runtime.py', 'tests/test_studio_runtime.py', 'tests/test_image_runtime_hardening.py', 'tools/introduction_*.py', 'tools/comfy_*.py', 'tools/klein_space_backend.py', 'tools/cloudflare_image_backend.py', 'tools/shot_controls.py', 'tools/scene_pack_preflight.py', 'tests/test_scene_pack_preflight.py', 'tests/test_shot_controls.py', 'tests/test_klein_space_backend.py', 'tests/test_comfy*.py', 'episodes/berakhot-01-01/comfy-opening-images.json', 'tests/test_introduction_*.py', 'episodes/berakhot-01-01/introduction-proof.json', '.github/workflows/introduction-proof.yml']
permissions:
  contents: read
jobs:
  assembly-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core
      - name: Offline image pipeline and fake ComfyUI integration (no GPU)
        run: |
          python -m unittest discover -s tests -p 'test_comfy*.py' -v
          python -m unittest discover -s tests -p 'test_klein_space_backend.py' -v
          python -m unittest discover -s tests -p 'test_shot_controls.py' -v
          python -m unittest discover -s tests -p 'test_scene_pack_preflight.py' -v
          python -m tools.scene_pack_preflight
          python -m tools.comfy_scene_images episodes/berakhot-01-01/comfy-opening-images.json --out build/comfy-opening-dry-run
      - name: Agent-free runtime acceptance (offline CPU, no secrets)
        run: |
          python -m unittest tests.test_studio_runtime tests.test_image_runtime_hardening -v
          python -m tools.studio plan
          python -m tools.studio review
      - run: python -m tools.introduction_proof
      - name: Assemble real private scene only when readiness gates pass
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.introduction_render import render
          root=Path.cwd()
          report=json.loads((root/'build/introduction-proof-state.json').read_text())
          if report['render_enabled']:
              config=json.loads((root/'episodes/berakhot-01-01/introduction-proof.json').read_text())
              print(render(config,root,root/'build/introduction-production-render'))
          else:
              print(report['status']+': real scene was not rendered')
          PYCODE
      - run: python -m unittest discover -s tests -p 'test_introduction_*.py' -v
      - uses: actions/upload-artifact@v4
        with:
          name: TECHNICAL-TEST-NOT-APPROVED-introduction
          path: |
            build/introduction-proof-state.json
            build/scene-pack-preflight.json
            build/comfy-opening-dry-run/report.json
            build/introduction-fixture/output/private-captions.*
            build/introduction-fixture/integration-result.json
