name: Protected Azure Speech F0 check and optional audition
on:
  workflow_dispatch:
    inputs:
      synthesize:
        description: One short Hebrew audition after live F0 verification
        type: boolean
        default: false
      compare_narrator:
        description: Optional two-take Avri comparison; requires synthesize
        type: boolean
        default: false
      new_narrators:
        description: Two non-Avri multilingual Hebrew casting probes (unapproved accents)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: azure-speech-audition
  cancel-in-progress: false
jobs:
  verify_environment:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify environment protections without releasing Speech secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.verify_speech_environment
  audition:
    needs: verify_environment
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    environment: azure-speech
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography==46.0.4
      - uses: azure/login@v2
        with:
          client-id: ${{ fromJSON(vars.AZURE_CONNECTION || '{}').clientId || vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ fromJSON(vars.AZURE_CONNECTION || '{}').tenantId || vars.AZURE_TENANT_ID }}
          subscription-id: ${{ fromJSON(vars.AZURE_CONNECTION || '{}').subscriptionId || vars.AZURE_SUBSCRIPTION_ID }}
      - name: Live ARM tier check, connection check and optional bounded synthesis
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_SPEECH_RESOURCE_ID: ${{ fromJSON(vars.AZURE_CONNECTION || '{}').resourceId || vars.AZURE_SPEECH_RESOURCE_ID }}
          NEW_NARRATORS: ${{ inputs.new_narrators }}
          COMPARE_NARRATOR: ${{ inputs.compare_narrator }}
          SYNTHESIZE: ${{ inputs.synthesize }}
        run: |
          if [ "$SYNTHESIZE" = true ]; then
            if [ "$NEW_NARRATORS" = true ]; then
              if [ "$COMPARE_NARRATOR" = true ]; then exit 2; fi
              python -m tools.azure_speech_check --synthesize --new-narrators
            elif [ "$COMPARE_NARRATOR" = true ]; then
              python -m tools.azure_speech_check --synthesize --compare-narrator
            else
              python -m tools.azure_speech_check --synthesize
            fi
          else
            python -m tools.azure_speech_check
          fi
      - uses: actions/upload-artifact@v4
        if: inputs.synthesize && success()
        with:
          name: encrypted-azure-audition
          path: build/azure-audition.bin
          retention-days: 7
          if-no-files-found: error
