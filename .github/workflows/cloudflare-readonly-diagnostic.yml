name: OPN02 provider readiness diagnostic (read-only)
on:
  issues:
    types: [edited]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.issue.number == 54 && github.actor == github.repository_owner && contains(github.event.issue.body, 'mishnah-cloudflare-readonly-diagnostic-v2-20261113')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read-only Cloudflare account token/model/usage probe (no inference)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import datetime,json,os,urllib.request,urllib.error
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          def request(path,body=None):
              data=json.dumps(body).encode() if body is not None else None
              req=urllib.request.Request('https://api.cloudflare.com/client/v4'+path,data=data,
                headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'},
                method='POST' if data else 'GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      return json.load(response),None
              except urllib.error.HTTPError as e:
                  return None,'HTTP_'+str(e.code)
              except Exception:
                  return None,'NETWORK_OR_TRANSPORT_ERROR'
          if not account or not token:
              print('READINESS_DIAGNOSTIC=CREDENTIALS_UNAVAILABLE')
              raise SystemExit(0)
          model,err=request('/accounts/'+account+'/ai/models/search?search=flux-2-klein-4b')
          if err:
              print('MODEL_CHECK='+err)
          elif model.get('success') is False or model.get('errors'):
              print('MODEL_CHECK=PROVIDER_REJECTED')
          else:
              ok=any(x.get('name')=='@cf/black-forest-labs/flux-2-klein-4b' for x in model.get('result',[]))
              print('MODEL_CHECK='+('AVAILABLE' if ok else 'MODEL_UNAVAILABLE'))
          now=datetime.datetime.now(datetime.timezone.utc)
          start=now.date().isoformat()+'T00:00:00Z'
          q='query { viewer { accounts(filter:{accountTag:'+json.dumps(account)+'}) { aiInferenceAdaptiveGroups(limit:1,filter:{datetime_geq:'+json.dumps(start)+',datetime_leq:'+json.dumps(now.isoformat())+'}) { sum { totalNeurons } } } } }'
          # Probe only read-only GraphQL. Classify errors; never print messages, IDs, or token values.
          def classify(errors):
              if not isinstance(errors,list): return 'MALFORMED_ERROR_LIST'
              s=' '.join(str(x.get('message','')).lower() for x in errors if isinstance(x,dict))
              if any(t in s for t in ('permission','unauthoriz','not authorized','access denied','not allowed','forbidden','insufficient scope','scope required','authentication','authenticate')):
                  return 'AUTHORIZATION_OR_SCOPE'
              if any(t in s for t in ('cannot query field','unknown field','unknown argument','unknown type','field does not exist','undefined field')):
                  return 'SCHEMA_OR_FIELD'
              if any(t in s for t in ('syntax error','parse error','invalid syntax','expected name','unexpected token')):
                  return 'QUERY_SYNTAX'
              if any(t in s for t in ('rate limit','too many request','quota exceeded')):
                  return 'RATE_LIMIT'
              if any(t in s for t in ('datetime','date range','invalid date','timestamp')):
                  return 'DATE_FILTER'
              return 'UNCLASSIFIED'
          base,base_error=request('/graphql',{'query':'query { viewer { budget } }'})
          if base_error:
              print('GRAPHQL_BASE_CHECK='+base_error)
          elif isinstance(base,dict) and base.get('errors'):
              print('GRAPHQL_BASE_CHECK='+classify(base.get('errors')))
          elif isinstance(base,dict) and isinstance(base.get('data'),dict):
              print('GRAPHQL_BASE_CHECK=OK')
          else:
              print('GRAPHQL_BASE_CHECK=UNKNOWN_RESPONSE')
          usage,err=request('/graphql',{'query':q})
          if err:
              print('USAGE_CHECK='+err)
          elif not isinstance(usage,dict):
              print('USAGE_CHECK=UNKNOWN_RESPONSE')
          elif usage.get('errors'):
              print('USAGE_CHECK=GRAPHQL_ERROR')
              print('USAGE_ERROR_CLASS='+classify(usage['errors']))
              print('USAGE_ERROR_COUNT='+str(min(len(usage['errors']),99)) if isinstance(usage['errors'],list) else 'USAGE_ERROR_COUNT=UNKNOWN')
              numeric=[]
              for e in usage['errors'] if isinstance(usage['errors'],list) else []:
                  if not isinstance(e,dict):continue
                  v=e.get('extensions',{}).get('code') if isinstance(e.get('extensions'),dict) else e.get('code')
                  if type(v) is int and 0 <= v <= 999999:numeric.append(v)
              print('USAGE_ERROR_NUMERIC_CODES='+(','.join(str(z) for z in numeric[:3]) if numeric else 'NONE'))
          elif not isinstance(usage.get('data'),dict):
              print('USAGE_CHECK=UNKNOWN_RESPONSE')
          else:
              try:
                  groups=usage['data']['viewer']['accounts']
                  if len(groups)!=1: raise ValueError()
                  values=groups[0]['aiInferenceAdaptiveGroups']
                  if not isinstance(values,list):raise ValueError()
                  print('USAGE_CHECK=VALID_RESPONSE_GROUPS_'+str(len(values)))
              except (KeyError,TypeError,ValueError):
                  print('USAGE_CHECK=INVALID_RESPONSE')
          print('INFERENCE_REQUESTS=0; PRIVATE_REFERENCES_ACCESSED=0; BILLING_CHANGES=0')
          PY
