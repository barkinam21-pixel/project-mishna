name: Modal independent generator offline CI
on:
  pull_request:
    paths:
      - 'tools/modal_image_backend.py'
      - 'tools/modal_flux2_worker.py'
      - 'tools/comfy_scene_images.py'
      - 'tools/studio_runtime.py'
      - 'tools/curated_reference_restore.py'
      - 'episodes/berakhot-01-01/comfy-opening-images.json'
      - 'tests/test_modal_image_backend.py'
      - 'tests/test_curated_reference_restore.py'
      - '.github/workflows/modal-independent-generator.yml'
  push:
    paths:
      - 'tools/modal_image_backend.py'
      - 'tools/modal_flux2_worker.py'
      - 'tools/comfy_scene_images.py'
      - 'tools/studio_runtime.py'
      - 'tools/curated_reference_restore.py'
      - 'episodes/berakhot-01-01/comfy-opening-images.json'
      - 'tests/test_modal_image_backend.py'
      - 'tests/test_curated_reference_restore.py'
      - '.github/workflows/modal-independent-generator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-no-gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0 'modal>=1.0,<2.0'
      - name: Import Modal SDK worker without deploying or starting GPU
        run: |
          python - <<'PY'
          from tools.modal_flux2_worker import app, generate
          assert app.name == 'mishnah-flux2-klein4b'
          assert callable(generate.remote)
          print('Modal worker registered in SDK; no remote invocation')
          PY
      - name: Compile independent generator and integration
        run: python -m py_compile tools/modal_image_backend.py tools/modal_flux2_worker.py tools/comfy_scene_images.py tools/studio_runtime.py tools/curated_reference_restore.py
      - name: Test reference hashes, mock provider, authorization and provenance
        run: python -m unittest discover -s tests -p 'test_modal_image_backend.py' -v
      - name: Verify offline eight-image archive restoration with synthetic media
        run: python -m unittest discover -s tests -p 'test_curated_reference_restore.py' -v
      - name: Verify Modal studio plan without GPU or credentials
        env:
          MISHNAH_IMAGE_BACKEND: modal
        run: python -m tools.studio plan
      - name: Verify default Modal doctor remains blocked
        env:
          MISHNAH_IMAGE_BACKEND: modal
        run: |
          set +e
          python -m tools.studio doctor > modal-doctor.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::Modal doctor did not fail closed"
            exit 1
          fi
          python - <<'PY'
          import json
          r=json.load(open('modal-doctor.json',encoding='utf-8'))
          assert r['status']=='BLOCKED',r
          assert r['cost']['provider_requests']==0,r
          assert 'MODAL_SAFETY_GATE_PRIVATE_RUNTIME_VERIFIED' in r['blocked_reason'], r
          assert not any('RUNTIME_ERROR' in reason for reason in r['blocked_reason']),r
          assert r['outputs']['image_backend']=='modal',r
          print('Modal doctor correctly blocked for expected safety gate; zero provider calls')
          PY
