name: Modal connection check (no GPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-modal-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check both credentials exist without printing them
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Missing MODAL_TOKEN_ID or MODAL_TOKEN_SECRET repository secret"
            exit 1
          fi
          echo "Both credentials are configured."
      - name: Install Modal CLI
        run: python -m pip install 'modal>=1.0,<2.0'
      - name: Verify Modal authentication (read-only; no GPU)
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: modal app list
