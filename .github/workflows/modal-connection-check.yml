name: Modal connection and billing metadata (read-only, no GPU)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-modal-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials are configured without printing them
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error::Modal credentials not configured"
            exit 1
          fi
      - name: Install Modal CLI (CPU-only setup, no app deployment)
        run: python -m pip install 'modal>=1.0,<2.0'
      - name: Read-only account and billing visibility report
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: python -m tools.modal_readonly_preflight
