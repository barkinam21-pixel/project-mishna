name: Mishnah one-run proof readiness (no generation or publication)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/cloud_proof.py'
      - 'tests/test_cloud_proof.py'
      - '.github/workflows/cloud-proof.yml'
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing test requirements
        run: |
          python -m pip install cryptography==46.0.4
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Run complete offline test suite (includes synthetic FFmpeg smoke)
        run: python -m unittest discover -s tests -v
      - name: Attempt existing 75-second production plan (no media generation)
        shell: bash
        run: |
          set +e
          python -m tools.cloud_proof
          result=$?
          set -e
          cat build/cloud-proof/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ] && [ "$result" -ne 3 ]; then exit "$result"; fi
      - name: Preserve blockers and input hashes only (NOT a movie)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-proof-report-NOT-A-FILM
          path: |
            build/cloud-proof/report.json
            build/cloud-proof/report.md
            build/cloud-proof/usage-ledger.jsonl
          if-no-files-found: error
