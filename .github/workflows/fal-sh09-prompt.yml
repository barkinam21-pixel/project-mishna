name: fal SH09 prompt-only manual pilot
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type YES to authorize one paid image"
        required: true
        default: "NO"
permissions:
  contents: read
concurrency:
  group: fal-sh09-prompt
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FAL_KEY: ${{ secrets.FAL_KEY }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - uses: actions/checkout@v4
      - name: One paid image only if explicitly authorized
        run: |
          NORMALIZED_CONFIRM="$(printf %s "$CONFIRM" | tr "[:lower:]" "[:upper:]" | tr -d "[:space:]")"
          test "$NORMALIZED_CONFIRM" = "YES" || { echo "Not authorized (confirmation must be YES)"; exit 1; }
          export CONFIRM="$NORMALIZED_CONFIRM"
          test -n "$FAL_KEY" || { echo "Missing key"; exit 1; }
          python tools/fal_sh09_prompt.py
      - name: Save unreviewed result privately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fal-sh09-prompt-${{ github.run_id }}
          path: local-output/fal-sh09-prompt/
          retention-days: 7
          if-no-files-found: ignore
