name: DEPRECATED - old SH09 raw-artifact pilot is BLOCKED

on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: "Legacy workflow retired for privacy and storyboard mismatch; no paid calls"
        required: true
        default: "NO"
        type: string

permissions:
  contents: read

jobs:
  blocked_legacy_sh09:
    runs-on: ubuntu-latest
    steps:
      - name: Reject legacy paid flow
        run: |
          echo "The original SH09 workflow was retired: it used an unsafe raw artifact upload and a storyboard-misaligned reference."
          echo "Use fal-private-sh01.yml, which requires fresh consent and encrypts the only GitHub artifact."
          exit 1
