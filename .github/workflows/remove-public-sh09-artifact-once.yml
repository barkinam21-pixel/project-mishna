name: ONE-TIME clean-up of older PUBLIC SH09 Actions image artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  remove_old_artifact_once:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Remove exact old unencrypted SH09 artifact after private Library backup
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Exact old artifact id, verified to have an intact private ChatGPT Library backup.
          ARTIFACT_ID=13079416372
          code=$(curl -sS -o "$RUNNER_TEMP/response.json" -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/actions/artifacts/$ARTIFACT_ID")
          if [ "$code" = 204 ]; then
            echo "SUCCESS: old unencrypted SH09 artifact deleted. Private Library backup remains."
          elif [ "$code" = 404 ] || [ "$code" = 410 ]; then
            echo "SUCCESS: old SH09 artifact is already unavailable (status $code)."
          else
            echo "ERROR: could not remove old private-image artifact (HTTP $code)." >&2
            exit 1
          fi
